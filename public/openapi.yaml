openapi: 3.1.0
info:
  title: Nexus API
  version: 0.19.0
  description: OpenAI-compatible model gateway. One slug, many labs. 0% markup on inference. The X-Nexus-Guest local echo is development-only and disabled in production.
servers:
  - url: /api/v1
paths:
  /chat/completions:
    post:
      summary: Chat Completions
      security:
        - bearerAuth: []
        - {}
      parameters:
        - in: header
          name: HTTP-Referer
          schema: { type: string }
          description: App origin for activity attribution
        - in: header
          name: X-Title
          schema: { type: string }
          description: App name for activity attribution
        - in: header
          name: X-Nexus-Guest
          schema: { type: string, enum: ["1"] }
          description: Development-only playground — local echo, disabled in production (8 rpm/IP)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                model: { type: string, example: meta-llama/llama-3.3-70b-instruct }
                models: { type: array, items: { type: string }, description: Fallback slugs }
                messages:
                  type: array
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role:
                        type: string
                        enum: [system, developer, user, assistant, tool, function]
                        description: developer is normalized with system priority; function is accepted for legacy clients.
                      content:
                        oneOf:
                          - type: string
                          - type: array
                            items:
                              type: object
                              required: [type]
                              properties:
                                type: { type: string, enum: [text, image_url, input_audio, file] }
                                text: { type: string }
                                image_url:
                                  oneOf:
                                    - type: string
                                    - type: object
                                      required: [url]
                                      properties:
                                        url: { type: string }
                                input_audio:
                                  type: object
                                  required: [data, format]
                                  properties:
                                    data: { type: string, description: Base64-encoded audio }
                                    format: { type: string, enum: [wav, mp3] }
                                file:
                                  type: object
                                  properties:
                                    file_data: { type: string }
                                    file_id: { type: string }
                                    filename: { type: string }
                      name: { type: string }
                      tool_call_id: { type: string }
                      tool_calls: { type: array }
                      function_call:
                        type: object
                        deprecated: true
                        required: [name, arguments]
                        properties:
                          name: { type: string }
                          arguments: { type: string }
                stream: { type: boolean }
                stream_options:
                  type: object
                  properties:
                    include_usage: { type: boolean }
                temperature: { type: number }
                max_tokens: { type: integer }
                top_p: { type: number }
                top_k: { type: integer }
                seed: { type: integer }
                stop: { oneOf: [{ type: string }, { type: array, items: { type: string } }] }
                file_ids:
                  type: array
                  items: { type: string }
                  description: Uploaded file ids; text is injected into the prompt
                transforms:
                  type: array
                  items: { type: string, enum: [middle-out] }
                include_reasoning: { type: boolean }
                reasoning:
                  type: object
                  properties:
                    effort: { type: string, enum: [low, medium, high] }
                    max_tokens: { type: integer }
                plugins:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: string, example: web }
                tools:
                  type: array
                  items:
                    type: object
                    properties:
                      type: { type: string, example: nexus:web_search }
                provider:
                  type: object
                  properties:
                    sort: { type: string, enum: [price, throughput, latency] }
                    only: { type: array, items: { type: string } }
                    ignore: { type: array, items: { type: string } }
                    order: { type: array, items: { type: string } }
                    allow_fallbacks: { type: boolean }
                    zdr: { type: boolean }
                    max_price:
                      type: object
                      properties:
                        prompt: { type: number }
                        completion: { type: number }
      responses:
        "200":
          description: Completion or SSE stream. Header X-Request-Id is the generation id.
        "401": { description: Invalid API key }
        "402": { description: Insufficient credits }
        "429": { description: Rate limited }
        "502": { description: Provider error }
  /models:
    get:
      summary: List executable gateway models and optionally reference-only Hub repositories
      security:
        - bearerAuth: []
        - {}
      parameters:
        - in: query
          name: category
          schema: { type: string, example: free }
        - in: query
          name: output_modalities
          schema: { type: string, example: text }
        - in: query
          name: supported_parameters
          schema: { type: string, example: tools }
        - in: query
          name: include_reference
          description: Include discovery-only catalog entries and public Hub model repositories. Hub repositories are always non-executable.
          schema: { type: boolean, default: false }
        - in: query
          name: mine
          description: Return only model repositories owned by the authenticated tenant. Requires a management identity with models:read.
          schema: { type: boolean, default: false }
      responses:
        "200": { description: Catalog }
    post:
      summary: Create a reference-only model repository in the existing model Hub
      description: Publishing a repository never creates an executable route or a price. Runtime promotion is an operator-controlled catalog process.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [namespace, slug, title]
              properties:
                namespace: { type: string }
                slug: { type: string }
                title: { type: string }
                description: { type: string, maxLength: 5000 }
                model_card: { type: string, maxLength: 64000 }
                visibility: { type: string, enum: [public, private] }
                gated: { type: boolean }
                license: { type: string }
                pipeline_tag: { type: [string, "null"] }
                library_name: { type: [string, "null"] }
                base_model: { type: [string, "null"] }
                tags: { type: array, items: { type: string } }
                workspace_id: { type: [string, "null"] }
      responses:
        "201": { description: Reference-only model repository created }
  /models/count:
    get:
      summary: Catalog size
      security: []
      responses:
        "200":
          description: Count
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      count: { type: integer }
                      executable: { type: integer }
                      reference_only: { type: integer }
  /models/{author}/{slug}:
    parameters:
      - in: path
        name: author
        required: true
        schema: { type: string }
      - in: path
        name: slug
        required: true
        schema: { type: string }
    get:
      summary: Executable catalog detail or Hub model repository profile
      security:
        - bearerAuth: []
        - {}
      responses:
        "200": { description: Model }
    patch:
      summary: Update a tenant-owned Hub model card and access policy
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Model repository updated without changing execution state }
    delete:
      summary: Delete a tenant-owned Hub model repository
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Repository and its revision history deleted }
  /models/{author}/{slug}/endpoints:
    get:
      summary: Hosts that can serve a model slug
      security: []
      parameters:
        - in: path
          name: author
          required: true
          schema: { type: string }
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "200": { description: Endpoints list }
  /models/{author}/{slug}/revisions:
    parameters:
      - in: path
        name: author
        required: true
        schema: { type: string }
      - in: path
        name: slug
        required: true
        schema: { type: string }
    get:
      summary: List authorized immutable model repository snapshots
      security:
        - bearerAuth: []
        - {}
      responses:
        "200": { description: Revision history }
        "403": { description: Gated model repository approval required }
    post:
      summary: Atomically publish the next model repository snapshot
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commit_message, files]
              properties:
                commit_message: { type: string, maxLength: 240 }
                metadata: { type: object }
                files:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [file_id, path]
                    properties:
                      file_id: { type: string }
                      path: { type: string }
      responses:
        "201": { description: Snapshot committed with monotonic revision and SHA }
  /models/{author}/{slug}/evaluations:
    parameters:
      - in: path
        name: author
        required: true
        schema: { type: string }
      - in: path
        name: slug
        required: true
        schema: { type: string }
    get:
      summary: List structured model evaluation results
      description: Anonymous readers receive only platform-verified results. Repository managers also receive submitted and rejected results.
      security:
        - bearerAuth: []
        - {}
      responses:
        "200": { description: Evaluation results anchored to immutable model revisions }
    post:
      summary: Submit an evaluation result for platform verification
      description: The evidence URL is recorded but never fetched by this request. SHA-256 binds the claim to the reviewed evidence artifact.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, benchmark, task, dataset, metric, metric_value, evaluator, evidence_url, evidence_sha256]
              properties:
                revision: { type: integer, minimum: 1 }
                benchmark: { type: string, maxLength: 160 }
                task: { type: string, maxLength: 120 }
                dataset: { type: string, maxLength: 240 }
                dataset_revision: { type: [string, "null"], maxLength: 160 }
                metric: { type: string, maxLength: 120 }
                metric_value: { type: number }
                higher_is_better: { type: boolean, default: true }
                sample_count: { type: [integer, "null"], minimum: 1 }
                evaluator: { type: string, maxLength: 160 }
                evaluator_version: { type: [string, "null"], maxLength: 120 }
                evidence_url: { type: string, format: uri, maxLength: 2048 }
                evidence_sha256: { type: string, pattern: "^[a-fA-F0-9]{64}$" }
      responses:
        "201": { description: Evaluation submitted; public visibility remains fail-closed until verified }
  /models/{author}/{slug}/promotions:
    parameters:
      - in: path
        name: author
        required: true
        schema: { type: string }
      - in: path
        name: slug
        required: true
        schema: { type: string }
    get:
      summary: List promotion reviews for a tenant-owned model repository
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Promotion history and immutable decision checklists }
    post:
      summary: Request controlled promotion of a Hub revision
      description: Promotion links the exact Hub revision to an already executable, price-verified runtime catalog model. It never executes uploaded weights or lets a publisher self-attest provider pricing.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, runtime_model_id]
              properties:
                revision: { type: integer, minimum: 1 }
                runtime_model_id: { type: string, maxLength: 200, example: meta-llama/llama-3.3-70b-instruct }
      responses:
        "201": { description: Promotion request queued for platform review }
        "409": { description: Repository, revision, or runtime route does not satisfy promotion preconditions }
  /models/{author}/{slug}/access:
    parameters:
      - in: path
        name: author
        required: true
        schema: { type: string }
      - in: path
        name: slug
        required: true
        schema: { type: string }
    get:
      summary: Read own model access state or owner approval queue
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Access grants }
    post:
      summary: Request access to a public gated model repository
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Access request pending }
    patch:
      summary: Approve or reject a model repository access request
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Access decision persisted }
  /models/{author}/{slug}/resolve/{revision}/{path}:
    parameters:
      - in: path
        name: author
        required: true
        schema: { type: string }
      - in: path
        name: slug
        required: true
        schema: { type: string }
      - in: path
        name: revision
        required: true
        schema: { type: string, description: "Revision number, SHA, or main" }
      - in: path
        name: path
        required: true
        schema: { type: string }
    get:
      summary: Download an authorized model repository artifact
      security:
        - bearerAuth: []
        - {}
      responses:
        "200": { description: Artifact bytes with immutable caching for public pinned revisions }
        "403": { description: Gated model repository approval required }
  /providers:
    get:
      summary: Inference hosts
      security: []
      responses:
        "200":
          description: Provider list with wired + model_count
  /routing/preview:
    post:
      summary: Preview route hops before chat
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages]
              properties:
                model: { type: string }
                messages: { type: array }
      responses:
        "200": { description: Route hops and live/local_echo mode }
  /shares:
    get:
      summary: List own shares (auth) or read one public share (?id=)
      security:
        - bearerAuth: []
        - {}
      parameters:
        - in: query
          name: id
          schema: { type: string }
      responses:
        "200": { description: Share list or single payload }
    post:
      summary: Create a public read-only chat share
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages]
              properties:
                model: { type: string }
                messages: { type: array }
                title: { type: string }
                stats: { type: object }
                comparing: { type: boolean }
      responses:
        "200": { description: Share id and url }
    delete:
      summary: Revoke own share
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: deleted }
  /status:
    get:
      summary: Instance wiring status
      security: []
      responses:
        "200": { description: Providers and infra flags }
  /credits:
    get:
      summary: Remaining credits
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "total_credits, total_usage, remaining" }
  /generation:
    get:
      summary: Generation stats
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: "Usage, cost, provider, latency" }
  /generations:
    get:
      summary: Recent generations
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
        - in: query
          name: model
          schema: { type: string }
        - in: query
          name: provider
          schema: { type: string }
        - in: query
          name: byok
          schema: { type: string, enum: ["0", "1"] }
        - in: query
          name: errors
          schema: { type: string, enum: ["0", "1"] }
        - in: query
          name: days
          schema: { type: integer }
        - in: query
          name: api_key
          schema: { type: string }
        - in: query
          name: workspace
          schema: { type: string }
        - in: query
          name: app
          schema: { type: string, description: Match X-Title or HTTP-Referer }
      responses:
        "200": { description: List }
  /keys:
    get:
      summary: List API keys
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Keys (usage/limit in USD) }
    post:
      summary: Create API key (or rotate via rotate_id)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                limit: { type: number, description: USD spend limit }
                rotate_id: { type: string }
                include_byok_in_limit: { type: boolean }
      responses:
        "200": { description: Includes plaintext key once }
    patch:
      summary: Update API key (name, disabled, limit)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string }
                name: { type: string }
                disabled: { type: boolean }
                limit: { type: number }
      responses:
        "200": { description: Updated key }
    delete:
      summary: Revoke API key
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: success }
  /auth/key:
    get:
      summary: Current key stats
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "Label, usage, limit" }
  /byok:
    get:
      summary: BYOK credentials
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Credentials (no plaintext keys) }
    post:
      summary: Store encrypted BYOK key
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, key]
              properties:
                provider: { type: string }
                key: { type: string }
                label: { type: string }
      responses:
        "200": { description: Credential id }
    delete:
      summary: Soft-delete BYOK credential
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: success }
  /workspaces:
    get:
      summary: Workspaces and budgets
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Workspaces }
    post:
      summary: Create workspace
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Workspace }
    patch:
      summary: Update name or monthly budget
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Workspace }
  /presets:
    get:
      summary: List presets
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Presets }
    post:
      summary: Create preset (@slug)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Preset }
    delete:
      summary: Delete preset
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: success }
  /embeddings:
    post:
      summary: Embeddings (billed + generation ledger)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Vectors }
  /images/generations:
    post:
      summary: Images (billed + generation ledger)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Image payload }
  /audio/speech:
    post:
      summary: TTS (billed + generation ledger)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Audio bytes }
  /audio/transcriptions:
    post:
      summary: STT (billed + generation ledger)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Transcript }
  /files:
    get:
      summary: List or get a file
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: id
          schema: { type: string }
        - in: query
          name: workspace_id
          schema: { type: string }
          description: Restrict listing and quota metadata to one accessible workspace
      responses:
        "200": { description: File metadata plus tenant storage usage and quota }
    post:
      summary: Upload a small file (multipart, max 8 MB)
      description: Computes SHA-256 server-side. Uses S3-compatible object storage when configured and a Postgres fallback otherwise.
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Ready file with digest and storage metadata }
    delete:
      summary: Delete a file
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: success }
        "409": { description: File is referenced by an immutable Hub revision }
  /files/uploads:
    post:
      summary: Reserve a direct or multipart artifact upload (max 50 GiB)
      description: Reserves tenant quota transactionally. Objects up to 100 MiB use one signed PUT; larger objects use retryable 64 MiB parts with a signed SHA-256 per part.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, bytes, sha256]
              properties:
                filename: { type: string, maxLength: 512 }
                mime: { type: string, default: application/octet-stream }
                bytes: { type: integer, minimum: 1, maximum: 53687091200 }
                sha256: { type: string, pattern: "^[a-fA-F0-9]{64}$" }
                workspace_id: { type: [string, "null"] }
      responses:
        "201": { description: Pending file and single-PUT or multipart transfer plan }
        "413": { description: Artifact exceeds plan quota or direct-upload size }
        "503": { description: Object storage is not configured }
  /files/uploads/{id}/parts:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      summary: List uploaded parts for a resumable artifact upload
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "Uploaded part numbers, lengths, and storage-verified checksums" }
        "409": { description: Upload is not an active multipart transfer }
    post:
      summary: Sign a batch of multipart artifact parts
      description: Signs at most 16 consecutive-plan part numbers with exact lengths and caller-provided SHA-256 checksums. A repeated part number replaces that part in S3.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parts]
              properties:
                parts:
                  type: array
                  minItems: 1
                  maxItems: 16
                  items:
                    type: object
                    required: [part_number, sha256]
                    properties:
                      part_number: { type: integer, minimum: 1, maximum: 10000 }
                      sha256: { type: string, pattern: "^[a-fA-F0-9]{64}$" }
      responses:
        "200": { description: Short-lived signed PUT requests for the selected parts }
        "409": { description: Upload is not active }
  /files/uploads/{id}/complete:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      summary: Verify and finalize a direct or multipart artifact upload
      description: For multipart objects, verifies consecutive part numbers, exact lengths, every SHA-256, the composite checksum, final size, and immutable full-file digest metadata before making the artifact revision-eligible.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Ready file metadata }
        "409": { description: "Size, checksum, or upload state mismatch" }
  /files/{id}/content:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      summary: Download a tenant-accessible ready file
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Database-backed file bytes }
        "307": { description: Redirect to a short-lived signed object URL }
        "409": { description: Upload is not ready }
  /analytics:
    get:
      summary: Usage totals by model, provider, and day
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: days
          schema: { type: integer, default: 30 }
      responses:
        "200":
          description: totals, by_day, by_model, by_provider
  /guardrails:
    get:
      summary: List guardrails
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Guardrails }
    post:
      summary: Create guardrail
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Guardrail }
    delete:
      summary: Delete guardrail
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: success }
  /observability:
    get:
      summary: List generation webhooks or recent delivery metadata
      parameters:
        - in: query
          name: deliveries
          schema: { type: string, enum: ["1"] }
          description: Set to 1 to return the latest 50 tenant-scoped delivery attempts. Payloads are never returned.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Destinations or redacted delivery metadata }
    post:
      summary: Add webhook or ping existing (action=ping)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string }
                name: { type: string }
                action: { type: string, enum: [ping] }
                id: { type: string, description: Destination id when action=ping }
      responses:
        "200": { description: Destination or ping result }
    delete:
      summary: Soft-delete webhook
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: success }
  /oauth:
    post:
      summary: Issue PKCE code or exchange for an API key
      security:
        - bearerAuth: []
        - {}
      responses:
        "200": { description: code or key }
  /completions:
    post:
      summary: Completions legacy (OpenAI)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Completion }
  /messages:
    post:
      summary: Anthropic Messages envelope (engine = chat)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [model, messages]
              properties:
                model: { type: string }
                max_tokens: { type: integer }
                messages: { type: array }
                stream: { type: boolean }
                fallbacks: { type: array }
                provider: { type: object }
      responses:
        "200": { description: Anthropic message object }
  /responses:
    post:
      summary: OpenAI Responses envelope (engine = chat)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [model, input]
              properties:
                model: { type: string }
                input:
                  description: String or Responses input items. Message roles accept user, assistant, system, and developer; unsupported roles fail with invalid_request.
                max_output_tokens: { type: integer }
                stream: { type: boolean }
                provider: { type: object }
      responses:
        "200": { description: "Response object with output[]" }
  /videos:
    post:
      summary: Start video job (Fal / Replicate / local)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Job }
    get:
      summary: Poll video job
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Job }
  /organization:
    get:
      summary: List organizations
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Orgs }
    post:
      summary: Create organization or add member
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Org }
    delete:
      summary: Remove member or org
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: success }
  /datasets:
    get:
      summary: List public datasets or the authenticated tenant repositories
      security:
        - bearerAuth: []
        - {}
      parameters:
        - in: query
          name: mine
          schema: { type: boolean, default: false }
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: task
          schema: { type: string }
        - in: query
          name: tag
          schema: { type: string }
      responses:
        "200": { description: Dataset repositories visible in the selected scope }
    post:
      summary: Create a dataset repository and claim its tenant namespace
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [namespace, slug, title]
              properties:
                namespace: { type: string }
                slug: { type: string }
                title: { type: string }
                description: { type: string }
                visibility: { type: string, enum: [public, private] }
                gated: { type: boolean }
                license: { type: string }
                task: { type: [string, "null"] }
                tags: { type: array, items: { type: string } }
                workspace_id: { type: [string, "null"] }
      responses:
        "201": { description: Dataset repository created }
  /datasets/{namespace}/{slug}:
    parameters:
      - in: path
        name: namespace
        required: true
        schema: { type: string }
      - in: path
        name: slug
        required: true
        schema: { type: string }
    get:
      summary: Read a dataset card and authorized revision history
      security:
        - bearerAuth: []
        - {}
      responses:
        "200": { description: Dataset metadata; gated bytes are omitted until approved }
        "404": { description: Dataset is missing or private to another tenant }
    patch:
      summary: Update dataset metadata and access policy
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Dataset updated }
    delete:
      summary: Delete a dataset repository and its revision records
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Dataset deleted; source files remain }
  /datasets/{namespace}/{slug}/revisions:
    parameters:
      - in: path
        name: namespace
        required: true
        schema: { type: string }
      - in: path
        name: slug
        required: true
        schema: { type: string }
    get:
      summary: List authorized immutable snapshots
      security:
        - bearerAuth: []
        - {}
      responses:
        "200": { description: Revision history }
        "403": { description: Gated dataset approval required }
    post:
      summary: Atomically publish the next dataset snapshot
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commit_message, files]
              properties:
                commit_message: { type: string, maxLength: 240 }
                metadata: { type: object }
                files:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [file_id, path]
                    properties:
                      file_id: { type: string }
                      path: { type: string }
      responses:
        "201": { description: Snapshot committed with monotonic revision and SHA }
  /datasets/{namespace}/{slug}/access:
    parameters:
      - in: path
        name: namespace
        required: true
        schema: { type: string }
      - in: path
        name: slug
        required: true
        schema: { type: string }
    get:
      summary: Read own access state or owner approval queue
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Access grants }
    post:
      summary: Request access to a public gated dataset
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Access request pending }
    patch:
      summary: Approve or reject a gated access request
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Access decision persisted }
  /datasets/{namespace}/{slug}/resolve/{revision}/{path}:
    parameters:
      - in: path
        name: namespace
        required: true
        schema: { type: string }
      - in: path
        name: slug
        required: true
        schema: { type: string }
      - in: path
        name: revision
        required: true
        schema: { type: string, description: "Revision number, SHA, or main" }
      - in: path
        name: path
        required: true
        schema: { type: string }
    get:
      summary: Download a file from an authorized dataset snapshot
      security:
        - bearerAuth: []
        - {}
      responses:
        "200": { description: File bytes with immutable caching for public pinned revisions }
        "403": { description: Gated dataset approval required }
  /spaces:
    get:
      summary: List public Spaces or the authenticated tenant Spaces
      security:
        - bearerAuth: []
        - {}
      parameters:
        - in: query
          name: mine
          schema: { type: boolean, default: false }
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: model
          schema: { type: string }
      responses:
        "200": { description: Spaces visible in the selected scope }
    post:
      summary: Create a safe multi-provider Space and claim its Hub namespace
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [namespace, slug, title]
              properties:
                namespace: { type: string }
                slug: { type: string }
                title: { type: string }
                description: { type: string }
                visibility: { type: string, enum: [public, private] }
                model: { type: string, default: nexus/auto }
                system_prompt: { type: string, maxLength: 32000 }
                starter_prompt: { type: [string, "null"], maxLength: 4000 }
                temperature: { type: number, minimum: 0, maximum: 2 }
                max_tokens: { type: integer, minimum: 1, maximum: 131072 }
                workspace_id: { type: [string, "null"] }
      responses:
        "201": { description: Space created after executable-model validation }
  /spaces/{namespace}/{slug}:
    parameters:
      - in: path
        name: namespace
        required: true
        schema: { type: string }
      - in: path
        name: slug
        required: true
        schema: { type: string }
    get:
      summary: Read public or tenant-owned Space configuration
      security:
        - bearerAuth: []
        - {}
      responses:
        "200": { description: Space configuration and owner-visible recent runs }
        "404": { description: Space is missing or private to another tenant }
    patch:
      summary: Update a tenant-owned Space
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Space updated }
    delete:
      summary: Delete a tenant-owned Space and its run links
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Space deleted; generation accounting is retained }
  /spaces/{namespace}/{slug}/run:
    parameters:
      - in: path
        name: namespace
        required: true
        schema: { type: string }
      - in: path
        name: slug
        required: true
        schema: { type: string }
    post:
      summary: Execute a Space through the protected multi-provider gateway
      description: Requires an inference credential or account session. The runner identity is billed through reserve-to-settle; the Space owner is never billed implicitly.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt: { type: string, maxLength: 128000 }
                messages:
                  type: array
                  maxItems: 64
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role: { type: string, enum: [user, assistant] }
                      content: { type: string, maxLength: 128000 }
      responses:
        "200": { description: OpenAI-compatible chat completion with X-Request-Id and X-Nexus-Space }
        "401": { description: Missing inference identity }
        "404": { description: Space is missing or inaccessible }
  /datasets/models:
    get:
      summary: Model rankings dataset
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Rankings }
  /providers/health:
    get:
      summary: Circuit breakers
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Health }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
