openapi: 3.1.0
info:
  title: Nexus API
  version: 0.12.0
  description: OpenAI-compatible model gateway. One slug, many labs. 0% markup on inference.
servers:
  - url: /api/v1
paths:
  /chat/completions:
    post:
      summary: Chat Completions
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: HTTP-Referer
          schema: { type: string }
          description: App origin for activity attribution
        - in: header
          name: X-Title
          schema: { type: string }
          description: App name for activity attribution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                model: { type: string, example: meta-llama/llama-3.3-70b-instruct }
                models: { type: array, items: { type: string }, description: Fallback slugs }
                messages: { type: array, items: { type: object } }
                stream: { type: boolean }
                stream_options:
                  type: object
                  properties:
                    include_usage: { type: boolean }
                temperature: { type: number }
                max_tokens: { type: integer }
                top_p: { type: number }
                top_k: { type: integer }
                seed: { type: integer }
                stop: { oneOf: [{ type: string }, { type: array, items: { type: string } }] }
                file_ids:
                  type: array
                  items: { type: string }
                  description: Uploaded file ids; text is injected into the prompt
                transforms:
                  type: array
                  items: { type: string, enum: [middle-out] }
                include_reasoning: { type: boolean }
                reasoning:
                  type: object
                  properties:
                    effort: { type: string, enum: [low, medium, high] }
                    max_tokens: { type: integer }
                plugins:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: string, example: web }
                tools:
                  type: array
                  items:
                    type: object
                    properties:
                      type: { type: string, example: nexus:web_search }
                provider:
                  type: object
                  properties:
                    sort: { type: string, enum: [price, throughput, latency] }
                    only: { type: array, items: { type: string } }
                    ignore: { type: array, items: { type: string } }
                    order: { type: array, items: { type: string } }
                    allow_fallbacks: { type: boolean }
                    zdr: { type: boolean }
                    max_price:
                      type: object
                      properties:
                        prompt: { type: number }
                        completion: { type: number }
      responses:
        "200":
          description: Completion or SSE stream. Header X-Request-Id is the generation id.
        "401": { description: Invalid API key }
        "402": { description: Insufficient credits }
        "429": { description: Rate limited }
        "502": { description: Provider error }
  /models:
    get:
      summary: List models
      parameters:
        - in: query
          name: category
          schema: { type: string, example: free }
        - in: query
          name: output_modalities
          schema: { type: string, example: text }
        - in: query
          name: supported_parameters
          schema: { type: string, example: tools }
      responses:
        "200": { description: Catalog }
  /models/count:
    get:
      summary: Catalog size
      responses:
        "200":
          description: Count
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      count: { type: integer }
  /models/{author}/{slug}:
    get:
      summary: Model detail
      parameters:
        - in: path
          name: author
          required: true
          schema: { type: string }
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "200": { description: Model }
  /models/{author}/{slug}/endpoints:
    get:
      summary: Hosts that can serve a model slug
      parameters:
        - in: path
          name: author
          required: true
          schema: { type: string }
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "200": { description: Endpoints list }
  /providers:
    get:
      summary: Inference hosts
      responses:
        "200":
          description: Provider list with wired + model_count
  /routing/preview:
    post:
      summary: Preview route hops before chat
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages]
              properties:
                model: { type: string }
                messages: { type: array }
      responses:
        "200": { description: Route hops and live/local_echo mode }
  /shares:
    get:
      summary: List own shares (auth) or read one public share (?id=)
      parameters:
        - in: query
          name: id
          schema: { type: string }
      responses:
        "200": { description: Share list or single payload }
    post:
      summary: Create a public read-only chat share
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages]
              properties:
                model: { type: string }
                messages: { type: array }
                title: { type: string }
                stats: { type: object }
                comparing: { type: boolean }
      responses:
        "200": { description: Share id and url }
    delete:
      summary: Revoke own share
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: deleted }
  /status:
    get:
      summary: Instance wiring status
      responses:
        "200": { description: Providers and infra flags }
  /credits:
    get:
      summary: Remaining credits
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: total_credits, total_usage, remaining }
  /generation:
    get:
      summary: Generation stats
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Usage, cost, provider, latency }
  /generations:
    get:
      summary: Recent generations
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
        - in: query
          name: model
          schema: { type: string }
        - in: query
          name: provider
          schema: { type: string }
        - in: query
          name: byok
          schema: { type: string, enum: ["0", "1"] }
        - in: query
          name: errors
          schema: { type: string, enum: ["0", "1"] }
        - in: query
          name: days
          schema: { type: integer }
        - in: query
          name: api_key
          schema: { type: string }
        - in: query
          name: workspace
          schema: { type: string }
        - in: query
          name: app
          schema: { type: string, description: Match X-Title or HTTP-Referer }
      responses:
        "200": { description: List }
  /keys:
    get:
      summary: List API keys
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Keys (usage/limit in USD) }
    post:
      summary: Create API key (or rotate via rotate_id)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                limit: { type: number, description: USD spend limit }
                rotate_id: { type: string }
                include_byok_in_limit: { type: boolean }
      responses:
        "200": { description: Includes plaintext key once }
    patch:
      summary: Update API key (name, disabled, limit)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string }
                name: { type: string }
                disabled: { type: boolean }
                limit: { type: number }
      responses:
        "200": { description: Updated key }
    delete:
      summary: Revoke API key
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: success }
  /auth/key:
    get:
      summary: Current key stats
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Label, usage, limit }
  /byok:
    get:
      summary: BYOK credentials
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Credentials (no plaintext keys) }
    post:
      summary: Store encrypted BYOK key
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, key]
              properties:
                provider: { type: string }
                key: { type: string }
                label: { type: string }
      responses:
        "200": { description: Credential id }
    delete:
      summary: Soft-delete BYOK credential
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: success }
  /workspaces:
    get:
      summary: Workspaces and budgets
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Workspaces }
    post:
      summary: Create workspace
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Workspace }
    patch:
      summary: Update name or monthly budget
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Workspace }
  /presets:
    get:
      summary: List presets
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Presets }
    post:
      summary: Create preset (@slug)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Preset }
    delete:
      summary: Delete preset
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: success }
  /embeddings:
    post:
      summary: Embeddings (billed + generation ledger)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Vectors }
  /images/generations:
    post:
      summary: Images (billed + generation ledger)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Image payload }
  /audio/speech:
    post:
      summary: TTS (billed + generation ledger)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Audio bytes }
  /audio/transcriptions:
    post:
      summary: STT (billed + generation ledger)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Transcript }
  /files:
    get:
      summary: List or get a file
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: id
          schema: { type: string }
      responses:
        "200": { description: File metadata }
    post:
      summary: Upload a file (multipart, max 8MB)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: File id }
    delete:
      summary: Delete a file
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: success }
  /analytics:
    get:
      summary: Usage totals by model, provider, and day
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: days
          schema: { type: integer, default: 30 }
      responses:
        "200":
          description: totals, by_day, by_model, by_provider
  /guardrails:
    get:
      summary: List guardrails
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Guardrails }
    post:
      summary: Create guardrail
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Guardrail }
    delete:
      summary: Delete guardrail
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: success }
  /observability:
    get:
      summary: List generation webhooks
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Destinations }
    post:
      summary: Add webhook or ping existing (action=ping)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string }
                name: { type: string }
                action: { type: string, enum: [ping] }
                id: { type: string, description: Destination id when action=ping }
      responses:
        "200": { description: Destination or ping result }
    delete:
      summary: Soft-delete webhook
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: success }
  /oauth:
    post:
      summary: Issue PKCE code or exchange for an API key
      responses:
        "200": { description: code or key }
  /completions:
    post:
      summary: Completions legacy (OpenAI)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Completion }
  /messages:
    post:
      summary: Anthropic Messages envelope (engine = chat)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [model, messages]
              properties:
                model: { type: string }
                max_tokens: { type: integer }
                messages: { type: array }
                stream: { type: boolean }
                fallbacks: { type: array }
                provider: { type: object }
      responses:
        "200": { description: Anthropic message object }
  /responses:
    post:
      summary: OpenAI Responses envelope (engine = chat)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [model, input]
              properties:
                model: { type: string }
                input: {}
                max_output_tokens: { type: integer }
                stream: { type: boolean }
                provider: { type: object }
      responses:
        "200": { description: Response object with output[] }
  /videos:
    post:
      summary: Start video job (Fal / Replicate / local)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Job }
    get:
      summary: Poll video job
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Job }
  /organization:
    get:
      summary: List organizations
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Orgs }
    post:
      summary: Create organization or add member
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Org }
    delete:
      summary: Remove member or org
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: success }
  /datasets/models:
    get:
      summary: Model rankings dataset
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Rankings }
  /providers/health:
    get:
      summary: Circuit breakers
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Health }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
