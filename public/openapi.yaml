openapi: 3.1.0
info:
  title: Nexus API
  version: 0.4.0
  description: OpenAI-compatible model gateway. One slug, many labs.
servers:
  - url: /api/v1
paths:
  /chat/completions:
    post:
      summary: Chat Completions
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                model: { type: string, example: meta-llama/llama-3.3-70b-instruct }
                models: { type: array, items: { type: string } }
                messages: { type: array, items: { type: object } }
                stream: { type: boolean }
                temperature: { type: number }
                max_tokens: { type: integer }
                tools:
                  type: array
                  items:
                    type: object
                    properties:
                      type: { type: string, example: nexus:web_search }
                provider:
                  type: object
                  properties:
                    sort: { type: string, enum: [price, throughput, latency] }
                    only: { type: array, items: { type: string } }
                    ignore: { type: array, items: { type: string } }
                    order: { type: array, items: { type: string } }
                    allow_fallbacks: { type: boolean }
                    zdr: { type: boolean }
                    max_price:
                      type: object
                      properties:
                        prompt: { type: number }
                        completion: { type: number }
      responses:
        "200": { description: Completion or SSE stream }
        "401": { description: Invalid API key }
        "402": { description: Insufficient credits }
  /models:
    get:
      summary: List models
      responses:
        "200": { description: Catalog }
  /models/{author}/{slug}:
    get:
      summary: Model detail
      parameters:
        - in: path
          name: author
          required: true
          schema: { type: string }
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "200": { description: Model }
  /providers:
    get:
      summary: Inference hosts
      responses:
        "200": { description: Provider list }
  /credits:
    get:
      summary: Remaining credits
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Balance }
  /keys:
    get:
      summary: List API keys
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Keys }
  /byok:
    get:
      summary: BYOK credentials
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Credentials }
  /embeddings:
    post:
      summary: Embeddings
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Vectors }
  /images/generations:
    post:
      summary: Images
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Image payload }
  /audio/speech:
    post:
      summary: TTS
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Audio bytes }
  /audio/transcriptions:
    post:
      summary: STT
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Transcript }
  /status:
    get:
      summary: Wiring status (no secrets)
      responses:
        "200": { description: Status }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
